spring:
  datasource:
    url: jdbc:h2:mem:jobtrakt-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

jobtrakt:
  jwt:
    secret: integration-test-secret-with-at-least-thirty-two-characters
    expiration-seconds: 3600
  cors:
    allowed-origin: http://localhost:5173

JOB_POLL_DELAY_MS: 60000
